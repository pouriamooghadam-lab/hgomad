name: Build and Package for Shared Host

on:
  workflow_dispatch: # اجازه اجرای دستی

jobs:
  build-and-zip:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 🟢 Setup Node.js (Version 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: 📦 Install Dependencies
        run: npm install
        
      - name: 🏗️ Build Frontend
        run: npm run build
        
      - name: 🗂️ Prepare Deployment Structure
        run: |
          # ساخت پوشه‌های مقصد
          mkdir -p release_package/public_html
          mkdir -p release_package/public_html/api
          
          # کپی فایل‌های بیلد شده ری‌اکت (اگر پوشه dist وجود داشته باشد)
          if [ -d "dist" ]; then
            cp -r dist/* release_package/public_html/
            echo "✅ Frontend built and copied successfully."
          else
            echo "❌ ERROR: dist folder not found! Build might have failed."
            ls -la
            exit 1
          fi
          
          # کپی فایل‌های بک‌اند PHP
          if [ -d "jservice" ]; then
            cp -r jservice/* release_package/public_html/api/
            echo "✅ Backend files copied successfully."
          else
            echo "⚠️ WARNING: jservice folder not found."
          fi
          
          # پاکسازی فایل‌های غیرضروری از پوشه API
          rm -rf release_package/public_html/api/node_modules
          rm -f release_package/public_html/api/package.json
          rm -f release_package/public_html/api/package-lock.json
          
          # ساخت فایل ZIP نهایی
          cd release_package
          zip -r ../jservice-ready-to-deploy.zip ./*
          echo "✅ ZIP file created successfully!"
          
      - name: 📤 Upload ZIP as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jservice-final-package
          path: jservice-ready-to-deploy.zip
          retention-days: 7
